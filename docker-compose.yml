services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pos_arigita_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - pos_arigita_network
    depends_on:
      - mysql
  nginx:
    image: nginx:alpine
    container_name: pos_arigita_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pos_arigita_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: pos_arigita_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: pos_arigita
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: pos_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - pos_arigita_mysql_data:/var/lib/mysql
    networks:
      - pos_arigita_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pos_arigita_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - pos_arigita_network
    depends_on:
      - mysql

networks:
  pos_arigita_network:
    driver: bridge

volumes:
  pos_arigita_mysql_data: